name: Build and publish wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Linux wheel: built inside the manylinux_2_28 image so the bundled DoPHOT
  # executable only needs the glibc baseline of that image. The wheel is
  # py3-none (no CPython ABI dependency), so one build covers all Python versions.
  # macOS and Windows wheels are not yet supported (see scripts/build_linux_wheel.sh).
  build-linux-wheel:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build manylinux wheel
        run: scripts/build_linux_wheel.sh

      - name: Test wheel installation
        run: |
          /opt/python/cp312-cp312/bin/python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/dophot_rubin-*manylinux*.whl
          cd /tmp && /tmp/wheeltest/bin/python -c "from dophot_rubin import DoPHOTConfig; import pathlib; p=pathlib.Path(DoPHOTConfig().doPHOTExecPath); assert p.exists(), p; print('✓ wheel installed, executable at', p)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl

      - name: Upload wheel to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build sdist
        run: |
          python -m build --sdist

      - name: Upload sdist to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
