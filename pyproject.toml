[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dophot-rubin"
dynamic = ["version"]
description = "Python wrapper for DoPHOT PSF photometry with Rubin Observatory pipeline integration"
readme = "README_PACKAGE.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools]
packages = ["dophot_rubin"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "dophot_rubin.__version__"}

[tool.setuptools.package-data]
dophot_rubin = [
    "pipeline.yaml",
    "dophot_c/working_data/dophot",
    "dophot_c/working_data/param_default_c",
]
